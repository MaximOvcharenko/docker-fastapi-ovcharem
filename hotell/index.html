<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotellbokningssystem</title>
    <link rel="stylesheet" href="hotel.css">
</head>
<body>
    <div class="container">
        <h1>Hotellbokningssystem</h1>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <form id="bookingForm">
            <div class="form-group">
                <label for="roomSelect">Välj rum:</label>
                <select id="roomSelect" required>
                    <option value="">-- Laddar rum --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dateInput">Bokningsdatum:</label>
                <input type="date" id="dateInput" required>
            </div>

            <div class="form-group">
                <label for="commentInput">Kommentar (valfritt):</label>
                <input type="text" id="commentInput" placeholder="Skriv din kommentar här...">
            </div>

            <button type="submit" id="saveBtn">Spara bokning</button>
        </form>

        <div class="bookings-section">
            <h2>Alla bokningar</h2>
            <div id="bookingsContainer">
                <div class="loading">Laddar bokningar...</div>
            </div>
        </div>
    </div>

    <script src="hotel.js"></script>
</body>
</html>
